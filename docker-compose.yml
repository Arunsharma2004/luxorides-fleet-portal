services:
  db:
    image: postgres:16
    container_name: luxorides-db
    environment:
      POSTGRES_DB: luxorides
      POSTGRES_USER: luxorides
      POSTGRES_PASSWORD: luxorides
    ports:
      - "5432:5432"
    volumes:
      - luxorides-data:/var/lib/postgresql/data

volumes:
  luxorides-data: